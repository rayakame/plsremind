openapi: 3.1.0
info:
  title: plsremind API
  version: "1"
  description: |
    The plsremind hub exposes one API for everything: the dashboard, connections and
    your own adapters all use the endpoints described here.

    Errors always have the same shape, see the `Error` schema. Timestamps are UTC in
    RFC 3339 format. IDs are UUIDs.

    ## Rate limits

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` (Unix seconds). Authenticated callers are counted per token or
    session, everyone else per IP address. When the limit is used up the API answers
    `429` with the code `rate_limited` and a `Retry-After` header in seconds.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
security:
  - session: []
  - bearer: []
tags:
  - name: Instance
    description: Public information about this hub and its first-time setup.
  - name: Authentication
    description: Logging in and out.
  - name: Account
    description: The profile and settings of a user.
  - name: Admin
    description: Instance administration. Needs a dashboard session of an admin.
paths:
  /info:
    get:
      tags: [Instance]
      operationId: getInfo
      summary: Get instance information
      security: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      tags: [Instance]
      operationId: setup
      summary: Create the first admin
      description: Only works while the instance has no users. The created user is an admin and is logged in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPasswordAccount"
      responses:
        "201":
          description: The admin account. A session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: The logged-in user. A session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      security: []
      responses:
        "204":
          description: The session is gone.
        default:
          $ref: "#/components/responses/Error"
  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/User"
    get:
      tags: [Account]
      operationId: getUser
      summary: Get a user's profile
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Account]
      operationId: deleteUser
      summary: Delete the account and all its data
      description: Session only. The last active admin cannot delete themselves.
      security:
        - session: []
      responses:
        "204":
          description: The account is gone.
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Account]
      operationId: updateUser
      summary: Change a user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                timezone:
                  type: string
                  description: IANA time zone name.
                  examples: [Europe/Berlin]
                quiet_hours:
                  $ref: "#/components/schemas/QuietHours"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account with username and password
      description: Needs `invite_code` unless registration is open. The new user is logged in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewPasswordAccount"
                - type: object
                  properties:
                    invite_code:
                      type: string
      responses:
        "201":
          description: The new user. A session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{user}/identities:
    parameters:
      - $ref: "#/components/parameters/User"
    get:
      tags: [Account]
      operationId: listIdentities
      summary: List the accounts linked to a user
      responses:
        "200":
          description: The identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Error"
  /users/{user}/password:
    parameters:
      - $ref: "#/components/parameters/User"
    put:
      tags: [Account]
      operationId: setPassword
      summary: Change or set the password
      description: |
        Session only. With an existing password, send `current_password`. An account that only
        logs in through a provider sends `username` instead to get a password login.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                current_password:
                  type: string
                username:
                  type: string
      responses:
        "204":
          description: The password is set.
        default:
          $ref: "#/components/responses/Error"
  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Get instance settings
      security:
        - session: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Admin]
      operationId: updateSettings
      summary: Change instance settings
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                registration:
                  type: string
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /admin/invites:
    get:
      tags: [Admin]
      operationId: listInvites
      summary: List invites
      security:
        - session: []
      responses:
        "200":
          description: All invites, newest first. Codes are not included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Admin]
      operationId: createInvite
      summary: Create an invite
      security:
        - session: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in:
                  $ref: "#/components/schemas/Duration"
      responses:
        "201":
          description: The invite. `code` is only shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
  /admin/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Admin]
      operationId: deleteInvite
      summary: Revoke an invite
      security:
        - session: []
      responses:
        "204":
          description: The invite is gone.
        default:
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of users, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin]
      operationId: updateUserAccess
      summary: Change a user's role or disable them
      description: Disabling a user ends their sessions. The last active admin cannot be demoted or disabled.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                disabled:
                  type: boolean
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: Delete a user and all their data
      security:
        - session: []
      responses:
        "204":
          description: The user is gone.
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Admin]
      operationId: resetPassword
      summary: Set a new password for a user
      description: Ends the user's sessions.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
      responses:
        "204":
          description: The password is set.
        default:
          $ref: "#/components/responses/Error"
  /users/{user}/tokens:
    parameters:
      - $ref: "#/components/parameters/User"
    get:
      tags: [Account]
      operationId: listTokens
      summary: List personal tokens
      security:
        - session: []
      responses:
        "200":
          description: The tokens, without their secret values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalToken"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Account]
      operationId: createToken
      summary: Create a personal token
      description: |
        A personal token lets your own tools use the API as you. It reaches your lists, items and
        settings, but it cannot manage tokens, change the password, unlink accounts or delete the account.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 1 to 64 characters, for you to recognise the token later.
      responses:
        "201":
          description: The token. `token` is only shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalToken"
        default:
          $ref: "#/components/responses/Error"
  /users/{user}/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/User"
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Account]
      operationId: deleteToken
      summary: Revoke a personal token
      security:
        - session: []
      responses:
        "204":
          description: The token no longer works.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: plsr_session
      description: Dashboard session, set by logging in.
    bearer:
      type: http
      scheme: bearer
      description: A personal token (`plsr_pat_...`) or a connection token (`plsr_con_...`).
  parameters:
    User:
      name: user
      in: path
      required: true
      description: "`@me` for the caller. Connections pass the hub ID of the user they act for."
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100.
      schema:
        type: integer
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [not_found]
            message:
              type: string
              description: Human-readable explanation in English.
            fields:
              type: object
              description: Per-field messages, only present for `validation_failed`.
              additionalProperties:
                type: string
    Info:
      type: object
      required: [name, version, setup_required, registration, login_methods]
      properties:
        name:
          type: string
        version:
          type: string
        setup_required:
          type: boolean
          description: True until the first admin was created through `/setup`.
        registration:
          type: string
          enum: [open, invite]
        login_methods:
          type: array
          items:
            type: object
            required: [key, type, name]
            properties:
              key:
                type: string
              type:
                type: string
                enum: [password, github, discord, oidc]
              name:
                type: string
    QuietHours:
      type: object
      required: [start, end]
      description: Reminders that fall into this window are delivered when it ends.
      properties:
        start:
          type: string
          examples: ["22:00"]
        end:
          type: string
          examples: ["08:00"]
    User:
      type: object
      required: [id, display_name, role, timezone, quiet_hours, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        timezone:
          type: string
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        created_at:
          type: string
          format: date-time
    NewPasswordAccount:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 3 to 32 characters from a-z, 0-9, underscore, dot and dash. Stored in lower case.
        password:
          type: string
          description: 8 to 256 characters.
        display_name:
          type: string
          description: Defaults to the username.
        timezone:
          type: string
          description: IANA time zone name, defaults to UTC.
    Duration:
      type: string
      description: A span of time made of days, hours and minutes in descending order, without spaces.
      examples: ["3d", "1d12h", "90m"]
    NextCursor:
      type: [string, "null"]
      description: Pass as `cursor` to get the next page. Null on the last page.
    Identity:
      type: object
      required: [id, provider, external_id, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          examples: [discord]
        external_id:
          type: string
          description: The user's ID at the provider. For `password` this is the username.
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    Settings:
      type: object
      required: [name, registration]
      properties:
        name:
          type: string
        registration:
          type: string
          enum: [open, invite]
    Invite:
      type: object
      required: [id, created_at, expires_at, used_at, used_by]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Only present in the response that creates the invite.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: [string, "null"]
          format: date-time
        used_by:
          type: [string, "null"]
          format: uuid
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled]
          properties:
            disabled:
              type: boolean
    PersonalToken:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: Only present in the response that creates the token.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
