[project]
name = "plsremind"
dynamic = ["version"]
description = "The Python SDK for plsremind: gateway client, cache and REST."
readme = "README.md"
authors = [{ name = "rayakame" }]
license = "MIT"
requires-python = ">=3.12"
keywords = ["plsremind", "todo", "reminders"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp~=3.14",
    "msgspec~=0.22",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/rayakame/plsremind"
Documentation = "https://github.com/rayakame/plsremind/tree/main/sdk/python#readme"
Repository = "https://github.com/rayakame/plsremind"
Issues = "https://github.com/rayakame/plsremind/issues"
Changelog = "https://github.com/rayakame/plsremind/blob/main/sdk/python/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "plsremind/internal/about.py"
pattern = '__version__: typing.Final\[str\] = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["plsremind"]

[tool.hatch.build.targets.sdist]
only-include = ["plsremind", "README.md", "LICENSE"]

[dependency-groups]
nox = [
    "nox[uv]==2026.10.20",
]
pyright = [
    "pyright==1.1.414",
]
pytest = [
    "asyncpg==0.32.0",
    "asyncpg-stubs==0.32.0",
    "coverage==7.17.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20261113",
]
ruff = [
    "ruff==0.17.5",
]

[tool.pyright]
include = ["plsremind", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.coverage.run]
source = ["plsremind"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = ["hub: needs a real hub, built from this repository, and Docker"]
filterwarnings = ["error"]

[tool.uv]
# The version is read from plsremind/internal/about.py when the package is built.
cache-keys = [{ file = "pyproject.toml" }, { file = "plsremind/internal/about.py" }]

