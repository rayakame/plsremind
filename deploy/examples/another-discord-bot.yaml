# A second Discord bot next to the first, as its own app of the instance:
#   cp examples/another-discord-bot.yaml compose.override.yaml
#   docker compose --profile discord up -d
# and add "discord-team:9091" to the targets of plsremind-discord in monitoring/scrape.yml.
services:
  discord-team:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: connections/discord/Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      hub:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TEAM_TOKEN:-}
      PLSREMIND_TOKEN: ${PLSREMIND_DISCORD_TEAM_TOKEN:-}
      PLSREMIND_URL: http://hub:8080
      PLSREMIND_PUBLIC_URL: ${PLSREMIND_PUBLIC_URL:-http://localhost:${PLSREMIND_PORT:-8080}}
      PLSREMIND_DISCORD_METRICS_ADDR: "0.0.0.0:9091"
    volumes:
      - discord-team:/data

volumes:
  discord-team:
