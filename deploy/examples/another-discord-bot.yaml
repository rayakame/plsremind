# A second Discord bot next to the first, as its own app of the instance, on the same image.
# Saved as discord-team.yaml next to compose.yaml, with COMPOSE_FILE=compose.yaml:discord-team.yaml
# and discord in COMPOSE_PROFILES in .env: docker compose up -d
# and with the monitoring add-on: echo '- targets: ["discord-team:9091"]' > monitoring/targets/discord-team.yml
services:
  discord-team:
    extends:
      file: compose.yaml
      service: discord
    environment:
      DISCORD_TOKEN: ${DISCORD_TEAM_TOKEN:-}
      PLSREMIND_TOKEN: ${PLSREMIND_DISCORD_TEAM_TOKEN:-}
    volumes:
      - discord-team:/data

volumes:
  discord-team:
