# A second Discord bot next to the first, as its own app of the instance, on the same image:
#   cp examples/another-discord-bot.yaml compose.override.yaml
#   docker compose up -d    (with discord in COMPOSE_PROFILES)
# and for its metrics: echo '- targets: ["discord-team:9091"]' > monitoring/targets/discord-team.yml
services:
  discord-team:
    extends:
      file: compose.yaml
      service: discord
    environment:
      DISCORD_TOKEN: ${DISCORD_TEAM_TOKEN:-}
      PLSREMIND_TOKEN: ${PLSREMIND_DISCORD_TEAM_TOKEN:-}
    volumes:
      - discord-team:/data

volumes:
  discord-team:
