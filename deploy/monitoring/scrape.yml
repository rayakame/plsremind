# Read by VictoriaMetrics, in the Prometheus format; any Prometheus-compatible scraper takes it as it is.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: plsremind-hub
    static_configs:
      - targets: ["hub:9090"]
  # Every Discord bot is a file in targets/; add one there for each further bot.
  - job_name: plsremind-discord
    file_sd_configs:
      - files: ["/etc/plsremind/targets/*.yml"]
