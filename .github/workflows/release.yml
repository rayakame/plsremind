name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: A release whose publishing failed, such as v0.1.0, sdk-python-v0.1.0 or sdk-ts-v0.1.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The app key lives in this environment, which only main may use.
    environment: release
    outputs:
      server: ${{ steps.release.outputs.release_created || steps.again.outputs.server }}
      server-version: ${{ steps.release.outputs.version || steps.again.outputs.version }}
      server-tag: ${{ steps.release.outputs.tag_name || steps.again.outputs.tag }}
      server-sha: ${{ steps.release.outputs.sha || steps.again.outputs.sha }}
      sdk-python: ${{ steps.release.outputs['sdk/python--release_created'] || steps.again.outputs.sdk-python }}
      sdk-python-sha: ${{ steps.release.outputs['sdk/python--sha'] || steps.again.outputs.sha }}
      sdk-ts: ${{ steps.release.outputs['sdk/ts--release_created'] || steps.again.outputs.sdk-ts }}
      sdk-ts-sha: ${{ steps.release.outputs['sdk/ts--sha'] || steps.again.outputs.sha }}
    steps:
      # Pull requests opened with GITHUB_TOKEN start no workflows, so release PRs would get no checks.
      - id: app
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # Releases first, on their own: if the pull requests fail afterwards, a rerun still publishes.
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      # release-please reports a release only once, so a release whose publishing failed is named by hand.
      - id: again
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) part=server ;;
            sdk-python-v[0-9]*) part=sdk-python ;;
            sdk-ts-v[0-9]*) part=sdk-ts ;;
            *) echo "$TAG is not a release tag of plsremind" >&2; exit 1 ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          {
            echo "$part=true"
            version="${TAG#sdk-python-}"
            version="${version#sdk-ts-}"
            echo "version=${version#v}"
            echo "tag=$TAG"
            echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          } >> "$GITHUB_OUTPUT"

  release-pull-requests:
    needs: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # release-please cannot write a series such as 0.2, and replaces its branch on every run.
      - id: server-pr
        name: Find the server's release pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          head="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head release-please--branches--main--components--plsremind --json headRefOid --jq '.[0].headRefOid // ""')"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - if: steps.server-pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.server-pr.outputs.head }}
          persist-credentials: false
      - if: steps.server-pr.outputs.head != ''
        name: Name the new series in the deploy files of that pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD: ${{ steps.server-pr.outputs.head }}
        run: |
          changed="$(python3 deploy/series.py --write)"
          if [ -z "$changed" ]; then
            echo "the deploy files already name the series of this release"
            exit 0
          fi
          # One commit through the API, so that it is signed and fails if the branch moved meanwhile.
          CHANGED="$changed" python3 - > commit.json <<'PY'
          import base64, json, os, pathlib, subprocess
          series = subprocess.run(["python3", "deploy/series.py"], check=True, capture_output=True, text=True).stdout.strip()
          print(json.dumps({
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              "variables": {"input": {
                  "branch": {
                      "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                      "branchName": "release-please--branches--main--components--plsremind",
                  },
                  "message": {"headline": f"chore: name the {series} series in the deploy files"},
                  "expectedHeadOid": os.environ["HEAD"],
                  "fileChanges": {"additions": [
                      {"path": name, "contents": base64.b64encode(pathlib.Path(name).read_bytes()).decode()}
                      for name in os.environ["CHANGED"].splitlines()
                  ]},
              }},
          }))
          PY
          gh api graphql --input commit.json --jq .data.createCommitOnBranch.commit.oid

  images:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.server-version }}
      ref: ${{ needs.release-please.outputs.server-sha }}

  bundle:
    needs: [release-please, images]
    if: needs.release-please.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Each part is built from the commit of its own release, which may not be the one that ran this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.server-sha }}
          persist-credentials: false
      - name: Attach the deploy bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.server-tag }}
        run: |
          bundle="$(deploy/bundle.sh "$RUNNER_TEMP/bundle")"
          gh release upload "$TAG" "$bundle" --clobber

  # Built apart from the publishing job, so that nothing the build runs can reach the token PyPI accepts.
  sdk-python-build:
    needs: release-please
    if: needs.release-please.outputs.sdk-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sdk-python-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # renovate: uv
          version: "0.13.10"
          enable-cache: false
      - run: uv build
        working-directory: sdk/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-python-dist
          path: sdk/python/dist/
          if-no-files-found: error
          retention-days: 7

  sdk-python:
    needs: [release-please, sdk-python-build]
    if: needs.release-please.outputs.sdk-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/plsremind/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # A release published again after a failure may already have files on PyPI.
          skip-existing: true

  sdk-ts:
    needs: release-please
    if: needs.release-please.outputs.sdk-ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/plsremind
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sdk-ts-sha }}
          persist-credentials: false
      # No registry-url: setup-node would set NODE_AUTH_TOKEN, which takes precedence over trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: |
          have="$(npm --version)"
          [ "$(printf '11.5.1\n%s\n' "$have" | sort -V | head -n 1)" = 11.5.1 ] \
            || { echo "npm $have is too old for trusted publishing" >&2; exit 1; }
      - id: published
        name: A release published again after a failure may already be on npm
        working-directory: sdk/ts
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "plsremind@$version" version 2>/dev/null)" = "$version" ]; then
            echo "plsremind $version is already on npm"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      # No install scripts in a job that can mint a publishing token.
      - if: steps.published.outputs.done != 'true'
        run: npm ci --ignore-scripts --workspace sdk/ts
      - if: steps.published.outputs.done != 'true'
        run: npm run build
        working-directory: sdk/ts
      - if: steps.published.outputs.done != 'true'
        run: npm run check:pack
        working-directory: sdk/ts
      - if: steps.published.outputs.done != 'true'
        run: npm publish
        working-directory: sdk/ts
