name: hub

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "docs/api/**"
      - "deploy/**"
      - "web/**"
      - "sdk/ts/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/hub.yml"
  pull_request:
    paths:
      - "hub/**"
      - "docs/api/**"
      - "deploy/**"
      - "web/**"
      - "sdk/ts/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hub/go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4.0.0
        with:
          sqlc-version: "1.31.1"
      - run: make lint
      - run: make test-race

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hub/go.mod
      - run: deploy/smoke.sh

  upgrade:
    # Only before a server release, or by hand: it takes several minutes.
    if: github.event_name == 'workflow_dispatch' || endsWith(github.head_ref, '--components--plsremind')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f hub/Dockerfile -t plsremind:candidate .
      - name: Update the last release, full of data, to this hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=none
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 50 \
            --json tagName --jq '.[] | select(.tagName | test("^v[0-9]")) | .tagName'); do
            # The bundle is attached after the images are out; a release still publishing has neither.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -q '^plsremind-deploy-.*\.tar\.gz$'; then
              previous="$tag"
              break
            fi
          done
          deploy/upgrade-test.sh "${previous#v}" plsremind:candidate

