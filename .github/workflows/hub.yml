name: hub

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "docs/api/**"
      - "deploy/**"
      - "web/**"
      - "sdk/ts/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/hub.yml"
  pull_request:
    paths:
      - "hub/**"
      - "docs/api/**"
      - "deploy/**"
      - "web/**"
      - "sdk/ts/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: make lint
      - run: make test-race

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
      - run: deploy/smoke.sh

  upgrade:
    # Only before a server release, or by hand: it takes several minutes.
    if: github.event_name == 'workflow_dispatch' || endsWith(github.head_ref, '--components--plsremind')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f hub/Dockerfile -t plsremind:candidate .
      - name: Update the last release, full of data, to this hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 50 \
            --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]"))][0].tagName // "none"')"
          deploy/upgrade-test.sh "${previous#v}" plsremind:candidate

