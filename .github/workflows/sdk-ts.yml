name: sdk-ts

on:
  push:
    branches: [main]
    paths: ["sdk/ts/**", "hub/**", "docs/**", "package*.json", ".github/workflows/sdk-ts.yml"]
  pull_request:
    paths: ["sdk/ts/**", "hub/**", "docs/**", "package*.json", ".github/workflows/sdk-ts.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, current]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: npm ci
      - run: npm run check
        working-directory: sdk/ts
      - run: npm run build
        working-directory: sdk/ts
      - run: npm run check:pack
        working-directory: sdk/ts
      - run: cmp LICENSE sdk/ts/LICENSE
      - run: npm test
        working-directory: sdk/ts
      - run: npm run test:hub
        working-directory: sdk/ts
