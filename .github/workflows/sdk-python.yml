name: sdk-python

on:
  push:
    branches: [main]
    paths: ["sdk/python/**", "hub/**", "docs/**", ".github/workflows/sdk-python.yml"]
  pull_request:
    paths: ["sdk/python/**", "hub/**", "docs/**", ".github/workflows/sdk-python.yml"]

defaults:
  run:
    working-directory: sdk/python

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # setup-uv publishes no floating major tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv run --group nox nox -s format-check ruff pyright
      - run: uv build && uvx twine check --strict dist/*
      - run: cmp ../../LICENSE LICENSE

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: uv run --group nox nox --force-python ${{ matrix.python }} -s pytest hub
