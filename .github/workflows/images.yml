name: images

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "web/**"
      - "sdk/**"
      - "connections/discord/**"
      - "package*.json"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_call:
    inputs:
      version:
        description: The release to build; its tags are pushed.
        type: string
        required: true
      ref:
        description: The commit the release was tagged at.
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.version || 'edge' }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Edge only comes from main
        if: ${{ !inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "edge is built from main only" >&2; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ inputs.version }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: A released version is never built again from another commit
        if: ${{ inputs.version }}
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          for image in plsremind plsremind-discord; do
            ref="ghcr.io/$OWNER/$image:$VERSION"
            if ! labels="$(docker buildx imagetools inspect "$ref" --format '{{ json (index .Image "linux/amd64").Config.Labels }}' 2> inspect.err)"; then
              # GHCR denies what does not exist yet; whoever may not read it may not push it either.
              grep -qiE 'not found|manifest unknown|name unknown|denied|403' inspect.err && continue
              cat inspect.err >&2
              exit 1
            fi
            revision="$(jq -r '."org.opencontainers.image.revision" // ""' <<< "$labels")"
            [ "$revision" = "$REF" ] || { echo "$ref already exists from $revision" >&2; exit 1; }
          done

  build:
    name: build ${{ matrix.image }} ${{ matrix.platform }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [plsremind, plsremind-discord]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: plsremind
            dockerfile: hub/Dockerfile
          - image: plsremind-discord
            dockerfile: connections/discord/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ inputs.version || format('edge-{0}', github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest for the manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [plsremind, plsremind-discord]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
      - id: manifest
        name: Join the architectures into one image
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          first="$(head -n 1 <<< "$TAGS")"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  check:
    name: check on ${{ matrix.arch }}
    needs: merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TAG: ${{ inputs.version || 'edge' }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: The hub runs and knows its version
        run: |
          got="$(docker run --rm "ghcr.io/$OWNER/plsremind:$TAG" version)"
          case "$TAG" in
            edge) [ "$got" = "edge-$GITHUB_SHA" ] ;;
            *) [ "$got" = "$TAG" ] ;;
          esac || { echo "the hub says $got" >&2; exit 1; }
      - name: The bot runs and knows its version
        run: |
          image="ghcr.io/$OWNER/plsremind-discord:$TAG"
          docker run --rm "$image" 2> out.txt && exit 1
          grep -q DISCORD_TOKEN out.txt
          got="$(docker run --rm --entrypoint /app/connections/discord/.venv/bin/python "$image" -c 'from plsremind_discord.about import __version__; print(__version__)')"
          [ "$TAG" = edge ] || [ "$got" = "$TAG" ] || { echo "the bot says $got" >&2; exit 1; }
