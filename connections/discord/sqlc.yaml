version: "2"
plugins:
  - name: python
    wasm:
      url: https://github.com/rayakame/sqlc-gen-better-python/releases/download/v0.9.0/sqlc-gen-better-python.wasm
      sha256: d1787aa32e61f2e73c81a4f93b3e5a9beeec918952cff3183fb96313057f58a8
sql:
  - engine: "sqlite"
    schema: "plsremind_discord/sql/migrations"
    queries: "plsremind_discord/sql/queries"
    codegen:
      - out: "plsremind_discord/db"
        plugin: python
        options:
          package: "plsremind_discord.db"
          emit_init_file: true
          sql_driver: "aiosqlite"
          model_type: "msgspec"
          docstrings: "none"
          omit_typechecking_block: true
